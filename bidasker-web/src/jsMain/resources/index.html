<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bidasker - Crypto Footprint Charts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0A0A; }
        #ComposeTarget { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        #debug { position: fixed; bottom: 0; left: 0; right: 0; padding: 8px; background: #222; color: #0f0; font: 10px monospace; z-index: 9999; }
    </style>
</head>
<body>
    <canvas id="ComposeTarget" width="800" height="600"></canvas>
    <div id="debug"></div>
    <script>
        (function() {
            var c = document.getElementById('ComposeTarget');
            var d = document.getElementById('debug');
            var msgs = [];
            msgs.push('canvas: ' + (c ? 'found' : 'NOT FOUND'));
            msgs.push('width:' + c.width + ' height:' + c.height);
            msgs.push('computed: ' + c.offsetWidth + 'x' + c.offsetHeight);
            try { var ctx = c.getContext('webgl2'); msgs.push('webgl2: ' + (ctx ? 'OK' : 'NULL')); } catch(e) { msgs.push('webgl2: ERROR ' + e.message); }
            try { var ctx = c.getContext('webgl'); msgs.push('webgl: ' + (ctx ? 'OK' : 'NULL')); } catch(e) { msgs.push('webgl: ERROR ' + e.message); }
            try { var ctx = c.getContext('2d'); msgs.push('canvas2d: ' + (ctx ? 'OK' : 'NULL')); } catch(e) { msgs.push('canvas2d: ERROR ' + e.message); }
            d.textContent = msgs.join(' | ');
        })();
    </script>
    <script src="bidasker-web.js"></script>
</body>
</html>
